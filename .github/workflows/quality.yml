name: Quality gates

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate assets, code, build, and presentation
        run: |
          npm run check:assets
          npm run lint
          npm test

      - name: Save visual validation differences
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: quality-visual-diff-${{ github.run_id }}
          path: |
            test-results/visual
            playwright-report
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
