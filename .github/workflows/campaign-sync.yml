name: Daily campaign catalog sync

on:
  schedule:
    # 21:17 UTC = 06:17 JST（翌日）
    - cron: "17 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "reportは検証のみ、applyは検証済みデータをmainへ反映"
        required: true
        default: report
        type: choice
        options:
          - report
          - apply

permissions:
  actions: read
  contents: write

concurrency:
  group: daily-campaign-catalog-sync
  cancel-in-progress: false

env:
  REPORT_PATH: .campaign-sync/report.json
  SLACK_PAYLOAD_PATH: .campaign-sync/slack-payload.json
  BASELINE_DOWNLOAD_DIR: .campaign-baseline/download
  BASELINE_UPLOAD_DIR: .campaign-baseline/upload

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Resolve execution settings
        id: settings
        env:
          REQUESTED_MODE: ${{ github.event.inputs.mode || vars.CAMPAIGN_AUTOMATION_MODE || 'report' }}
        run: |
          case "$REQUESTED_MODE" in
            report|apply) ;;
            *)
              echo "Unsupported CAMPAIGN_AUTOMATION_MODE: $REQUESTED_MODE" >&2
              exit 1
              ;;
          esac
          echo "checked_at=$(TZ=Asia/Tokyo date +%F)" >> "$GITHUB_OUTPUT"
          echo "mode=$REQUESTED_MODE" >> "$GITHUB_OUTPUT"

      - name: Read previous workflow conclusion
        id: previous_run
        if: always()
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const response = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "campaign-sync.yml",
              per_page: 10,
            });
            const previous = response.data.workflow_runs.find(
              (run) => run.id !== Number(context.runId) && run.status === "completed",
            );
            core.setOutput("conclusion", previous?.conclusion ?? "");

      - name: Locate latest validated baseline
        id: baseline_lookup
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const [artifactResponse, runResponse] = await Promise.all([
              github.rest.actions.listArtifactsForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              }),
              github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: "campaign-sync.yml",
                branch: "main",
                per_page: 100,
              }),
            ]);
            const eligibleRunIds = new Set(
              runResponse.data.workflow_runs
                .filter((run) => run.id !== Number(context.runId))
                .map((run) => run.id),
            );
            const candidates = artifactResponse.data.artifacts
              .filter((artifact) =>
                !artifact.expired &&
                /^campaign-baseline-v1-\d+$/.test(artifact.name) &&
                eligibleRunIds.has(artifact.workflow_run?.id),
              )
              .sort((left, right) =>
                String(right.created_at).localeCompare(String(left.created_at)),
              );
            const latest = candidates[0];
            core.setOutput("found", latest ? "true" : "false");
            core.setOutput("name", latest?.name ?? "");
            core.setOutput("run_id", latest?.workflow_run?.id ?? "");

      - name: Download latest validated baseline
        id: baseline_download
        if: >-
          steps.baseline_lookup.outcome == 'success' &&
          steps.baseline_lookup.outputs.found == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: ${{ steps.baseline_lookup.outputs.name }}
          path: ${{ env.BASELINE_DOWNLOAD_DIR }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.baseline_lookup.outputs.run_id }}

      - name: Select and restore comparison baseline
        id: baseline
        if: >-
          steps.baseline_lookup.outcome == 'success' &&
          (steps.baseline_lookup.outputs.found != 'true' ||
           steps.baseline_download.outcome == 'success')
        continue-on-error: true
        run: >-
          node scripts/campaign-baseline.mjs restore
          --data-directory=data/campaigns
          --artifact-directory=${{ env.BASELINE_DOWNLOAD_DIR }}
          --artifact-available=${{ steps.baseline_lookup.outputs.found || 'false' }}
          --selection-path=.campaign-sync/baseline-selection.json

      - name: Install dependencies
        id: dependencies
        if: steps.baseline.outcome == 'success'
        run: npm ci

      - name: Build candidate campaign catalog
        id: catalog
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          CAMPAIGN_AI_PROVIDER: ${{ vars.CAMPAIGN_AI_PROVIDER || 'openai' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_CAMPAIGN_MODEL: ${{ vars.OPENAI_CAMPAIGN_MODEL || 'gpt-5.6-terra' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_CAMPAIGN_MODEL: ${{ vars.ANTHROPIC_CAMPAIGN_MODEL || 'claude-sonnet-5' }}
          CAMPAIGN_AI_MAX_INPUT_CHARS: ${{ vars.CAMPAIGN_AI_MAX_INPUT_CHARS || '80000' }}
          CAMPAIGN_AI_MAX_OUTPUT_TOKENS: ${{ vars.CAMPAIGN_AI_MAX_OUTPUT_TOKENS || '4000' }}
          CAMPAIGN_AI_MAX_CALLS: ${{ vars.CAMPAIGN_AI_MAX_CALLS || '10' }}
          CAMPAIGN_AI_MAX_BUDGET_USD: ${{ vars.CAMPAIGN_AI_MAX_BUDGET_USD || '2' }}
          CAMPAIGN_AI_INPUT_USD_PER_MILLION: ${{ vars.CAMPAIGN_AI_INPUT_USD_PER_MILLION }}
          CAMPAIGN_AI_OUTPUT_USD_PER_MILLION: ${{ vars.CAMPAIGN_AI_OUTPUT_USD_PER_MILLION }}
        run: >-
          npm run sync:campaigns:auto --
          --checked-at=${{ steps.settings.outputs.checked_at }}
          --report-path=${{ env.REPORT_PATH }}
          --baseline-source=${{ steps.baseline.outputs.source }}
          --baseline-checked-at=${{ steps.baseline.outputs.checked_at }}
          --baseline-catalog-version=${{ steps.baseline.outputs.catalog_version }}
          --baseline-run-id=${{ steps.baseline.outputs.run_id }}
          --write

      - name: Ensure failure report exists
        if: always() && hashFiles(env.REPORT_PATH) == ''
        env:
          CHECKED_AT: ${{ steps.settings.outputs.checked_at }}
          BASELINE_SOURCE: ${{ steps.baseline.outputs.source || 'main' }}
          BASELINE_CHECKED_AT: ${{ steps.baseline.outputs.checked_at }}
          BASELINE_CATALOG_VERSION: ${{ steps.baseline.outputs.catalog_version }}
          BASELINE_RUN_ID: ${{ steps.baseline.outputs.run_id }}
        run: |
          mkdir -p .campaign-sync
          node -e 'const fs=require("node:fs"); const checkedAt=process.env.CHECKED_AT || new Date().toISOString().slice(0,10); const baseline={source:process.env.BASELINE_SOURCE || "main",checkedAt:process.env.BASELINE_CHECKED_AT || null,catalogVersion:process.env.BASELINE_CATALOG_VERSION || null,runId:process.env.BASELINE_RUN_ID || null}; fs.writeFileSync(".campaign-sync/report.json", JSON.stringify({checkedAt,baseline,safeToPublish:false,requiresAttention:true,additions:[],changes:[],ended:[],pending:[],warnings:[],errors:["候補生成前または候補生成中にワークフローが失敗しました。"]},null,2)+"\n")'

      - name: Read safety report
        id: report
        if: always() && hashFiles(env.REPORT_PATH) != ''
        run: |
          node -e 'const r=require("./.campaign-sync/report.json"); console.log(`safe_to_publish=${r.safeToPublish}`); console.log(`requires_attention=${r.requiresAttention}`); console.log(`content_changed=${Boolean(r.contentChanged)}`)' >> "$GITHUB_OUTPUT"

      - name: Synchronize required official images
        id: images
        if: steps.catalog.outcome == 'success' && steps.report.outputs.safe_to_publish == 'true'
        continue-on-error: true
        run: >-
          npm run sync:campaign-images --
          --checked-at=${{ steps.settings.outputs.checked_at }}
          --write

      - name: Validate generated site
        id: validation
        if: steps.images.outcome == 'success'
        continue-on-error: true
        run: |
          npm run check:assets
          npm run lint
          npm test

      - name: Prepare validated baseline artifact
        id: baseline_prepare
        if: >-
          steps.validation.outcome == 'success' &&
          steps.report.outputs.safe_to_publish == 'true'
        continue-on-error: true
        run: >-
          node scripts/campaign-baseline.mjs prepare
          --data-directory=data/campaigns
          --report-path=${{ env.REPORT_PATH }}
          --output-directory=${{ env.BASELINE_UPLOAD_DIR }}
          --source-commit=${{ github.sha }}
          --run-id=${{ github.run_id }}

      - name: Save validated comparison baseline
        id: baseline_upload
        if: steps.baseline_prepare.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: campaign-baseline-v1-${{ github.run_id }}
          path: ${{ env.BASELINE_UPLOAD_DIR }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

      - name: Save report artifact
        id: diagnostic_artifact
        if: always() && hashFiles(env.REPORT_PATH) != ''
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: campaign-sync-${{ steps.settings.outputs.checked_at || github.run_id }}
          path: |
            ${{ env.REPORT_PATH }}
            .campaign-sync/baseline-selection.json
            data/campaigns/generated
            data/campaigns/archive
            data/campaigns/images.json
          include-hidden-files: true
          retention-days: 30

      - name: Commit validated catalog to main
        id: commit
        if: >-
          steps.settings.outputs.mode == 'apply' &&
          steps.catalog.outcome == 'success' &&
          steps.images.outcome == 'success' &&
          steps.validation.outcome == 'success' &&
          steps.baseline_upload.outcome == 'success' &&
          steps.report.outputs.safe_to_publish == 'true'
        run: |
          git config user.name "campaign-catalog-bot"
          git config user.email "campaign-catalog-bot@users.noreply.github.com"
          git add data/campaigns/generated data/campaigns/archive data/campaigns/images.json public/assets/campaigns/official
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore(campaigns): daily sync ${{ steps.settings.outputs.checked_at }}"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify production deployment
        id: production
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        run: npm run verify:campaign-production

      - name: Prepare Slack notification
        id: notification
        if: always() && hashFiles(env.REPORT_PATH) != ''
        env:
          CAMPAIGN_AUTOMATION_MODE: ${{ steps.settings.outputs.mode || vars.CAMPAIGN_AUTOMATION_MODE || 'report' }}
          CAMPAIGN_PIPELINE_FAILED: ${{ steps.baseline_lookup.outcome == 'failure' || steps.baseline_download.outcome == 'failure' || steps.baseline.outcome == 'failure' || steps.catalog.outcome == 'failure' || steps.images.outcome == 'failure' || steps.validation.outcome == 'failure' || steps.baseline_prepare.outcome == 'failure' || steps.baseline_upload.outcome == 'failure' || steps.diagnostic_artifact.outcome == 'failure' || steps.commit.outcome == 'failure' || steps.production.outcome == 'failure' }}
          CAMPAIGN_PREVIOUS_CONCLUSION: ${{ steps.previous_run.outputs.conclusion }}
          CAMPAIGN_FAILURE_CONTEXT: >-
            baseline_lookup=${{ steps.baseline_lookup.outcome }},
            baseline_download=${{ steps.baseline_download.outcome }},
            baseline=${{ steps.baseline.outcome }},
            dependencies=${{ steps.dependencies.outcome }},
            catalog=${{ steps.catalog.outcome }},
            images=${{ steps.images.outcome }},
            validation=${{ steps.validation.outcome }},
            baseline_prepare=${{ steps.baseline_prepare.outcome }},
            baseline_upload=${{ steps.baseline_upload.outcome }},
            diagnostic_artifact=${{ steps.diagnostic_artifact.outcome }},
            commit=${{ steps.commit.outcome }},
            production=${{ steps.production.outcome }}
        run: >-
          npm run notify:campaign-sync --
          --report-path=${{ env.REPORT_PATH }}
          --payload-path=${{ env.SLACK_PAYLOAD_PATH }}
          --mode=${{ steps.settings.outputs.mode || vars.CAMPAIGN_AUTOMATION_MODE || 'report' }}

      - name: Send Slack notification
        id: slack
        if: always() && steps.notification.outputs.notify == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v4.0.0
        with:
          payload-file-path: ${{ env.SLACK_PAYLOAD_PATH }}
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook

      - name: Fail unsafe run
        if: >-
          always() &&
          (steps.settings.outcome == 'failure' ||
           steps.baseline_lookup.outcome == 'failure' ||
           steps.baseline_download.outcome == 'failure' ||
           steps.baseline.outcome == 'failure' ||
           steps.dependencies.outcome == 'failure' ||
           steps.catalog.outcome == 'failure' ||
           steps.report.outcome == 'failure' ||
           steps.report.outputs.safe_to_publish != 'true' ||
           steps.images.outcome == 'failure' ||
           steps.validation.outcome == 'failure' ||
           steps.baseline_prepare.outcome == 'failure' ||
           steps.baseline_upload.outcome == 'failure' ||
           steps.diagnostic_artifact.outcome == 'failure' ||
           steps.commit.outcome == 'failure' ||
           steps.production.outcome == 'failure' ||
           steps.notification.outcome == 'failure' ||
           steps.slack.outcome == 'failure')
        run: exit 1
